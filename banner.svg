<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d0d"/><stop offset=".55" stop-color="#1f1f2e"/><stop offset="1" stop-color="#3a1020"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <!-- Bloch sphere -->
  <g transform="translate(1010,150)" fill="none" stroke="#ee0000" stroke-width="2">
    <circle r="95" stroke-opacity=".9"/>
    <ellipse rx="95" ry="28" stroke-opacity=".5"/>
    <ellipse rx="95" ry="28" stroke-dasharray="4 6" stroke-opacity=".5" transform="rotate(90)"/>
    <line x1="0" y1="0" x2="52" y2="-70" stroke="#ffffff" stroke-width="3"/>
    <circle cx="52" cy="-70" r="6" fill="#ffffff" stroke="none"/>
    <text x="-14" y="-108" fill="#cfcfcf" stroke="none" font-family="monospace" font-size="18">|0⟩</text>
    <text x="-14" y="124" fill="#cfcfcf" stroke="none" font-family="monospace" font-size="18">|1⟩</text>
    <text x="62" y="-78" fill="#ffffff" stroke="none" font-family="monospace" font-size="20">|ψ⟩</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="60" y="110" fill="#ee0000" font-size="20">$ whoami</text>
    <text x="60" y="165" fill="#ffffff" font-size="52" font-weight="700">Ana Paula Appel</text>
    <text x="60" y="210" fill="#d6d6d6" font-size="22">AI · LLM inference · Quantum ML</text>
    <text x="60" y="245" fill="#8f8f8f" font-size="18">from research to production_</text>
  </g>
</svg>
